<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foodie - Online Food Delivery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🍔 Foodie</h1>
  <input type="text" id="search" placeholder="Search food... Biryani, Pizza..." onkeyup="searchFood()">
  <button class="cart-btn" onclick="showCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
</header>

<div class="filters">
  <button onclick="filterFood('all')">All</button>
  <button onclick="filterFood('veg')">🥦 Veg</button>
  <button onclick="filterFood('nonveg')">🍗 Non-Veg</button>
  <button onclick="filterFood('fastfood')">🍕 Fast Food</button>
  <button onclick="filterFood('drinks')">🥤 Drinks</button>
</div>

<div class="container" id="foodList"></div>

<!-- Cart Popup -->
<div id="cartBox" class="cart-box">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
  <h3 id="total">Total: ₹0</h3>
  <input type="text" id="custName" placeholder="Your Name">
  <input type="text" id="custAddress" placeholder="Delivery Address">
  <button class="order-btn" onclick="placeOrder()">Place Order</button>
  <button class="close-btn" onclick="hideCart()">Close</button>
  <p id="orderMsg"></p>
</div>

<script src="script.js"></script>
</body>
</html>
